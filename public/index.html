<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenTube</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo" id="logo"><i>▶</i><span>OpenTube</span></div>
  <div class="search"><input id="q" type="search" placeholder="Search videos and channels" aria-label="Search"><button id="sb">Search</button></div>
  <button class="up" id="upb">Upload</button>
  <button id="acc">Sign in</button>
  <button id="adm">Admin</button>
  <button id="tb" aria-label="Toggle theme">◐</button>
</header>
<div class="wrap">
  <nav>
    <a data-go="home">Home</a><a data-go="subs">Subscriptions</a><a data-go="channels">Channels</a>
    <a data-go="playlists">Playlists</a><a data-go="liked">Liked videos</a><a data-go="history">History</a>
    <a data-go="admin" id="navadmin" hidden>Admin panel</a>
  </nav>
  <main>
    <div class="chips" id="chips"></div>
    <div id="view"></div>
  </main>
</div>
<dialog id="m"></dialog>
<script src="app.js"></script>
</body>
</html>
