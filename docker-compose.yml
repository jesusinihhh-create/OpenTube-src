services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: opentube-mediamtx
    restart: unless-stopped
    env_file: .env
    ports:
      - "1935:1935/tcp" # RTMP from OBS
    expose:
      - "8888" # HLS, served publicly through Caddy HTTPS
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    command: ["/mediamtx.yml"]

  caddy:
    image: caddy:2
    container_name: opentube-caddy
    restart: unless-stopped
    environment:
      HLS_DOMAIN: ${HLS_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mediamtx

volumes:
  caddy_data:
  caddy_config:
