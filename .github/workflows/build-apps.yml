name: Build apps (Windows .exe and Android .apk)

'on':
  workflow_dispatch:
    inputs:
      site_url:
        description: "Your live OpenTube address, e.g. https://opentube.onrender.com"
        required: true
  push:
    tags: ["v*"]

env:
  SITE_URL: ${{ inputs.site_url || vars.SITE_URL }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: desktop
      - run: node make-config.js
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTube-Windows
          path: desktop/dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
        working-directory: mobile
      - run: node make-config.js
        working-directory: mobile
      - run: npx cap add android
        working-directory: mobile
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#d9262c' --iconBackgroundColorDark '#d9262c'
        working-directory: mobile
        continue-on-error: true
      - run: npx cap sync android
        working-directory: mobile
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - run: cp app/build/outputs/apk/debug/app-debug.apk ../OpenTube.apk
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTube-Android
          path: mobile/OpenTube.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
