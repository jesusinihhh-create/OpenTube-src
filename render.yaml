databases:
  - name: opentube-db
    databaseName: opentube
    plan: free

services:
  - type: web
    name: opentube
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opentube-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false          # you type this in the Render dashboard. It is never stored in this repo.
      - key: SESSION_SECRET
        generateValue: true  # Render creates a random secret for signing admin sessions
      - key: APPS_URL
        sync: false          # optional: link to your GitHub Releases page, shown as Settings > Get the apps
      - key: MAX_MB
        value: "50"
