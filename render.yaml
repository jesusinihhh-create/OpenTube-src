databases:
  - name: opentube-db
    databaseName: opentube
    user: opentube
    plan: free

services:
  - type: web
    name: opentube
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opentube-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MAX_MB
        value: "50"
